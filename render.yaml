services:
  - type: web
    name: macskawc
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: ADMIN_NAME
        value: Zsolt
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: NTFY_TOKEN
        sync: false
      - key: NTFY_RELAY_URL
        sync: false
      - key: NTFY_RELAY_SECRET
        sync: false
